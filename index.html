<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        .container {
            width: 100vw;
            height: 100dvh; /* 适配手机浏览器地址栏收放，避免抖动 */
        }
        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 铺满屏幕且不拉伸变形 */
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        < img src="photo.jpg" alt="图片">
    </div>
</body>
</html>
